<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课铃提醒</title>
  <link rel="stylesheet" href="reminder.css" />
</head>
<body>
  <div class="reminder-card" id="reminder-card">
    <div class="reminder-top drag-zone">
      <div class="top-pattern"></div>
      <div class="bell-mark">
        <svg viewBox="0 0 24 24"><path d="M18 8.5a6 6 0 0 0-12 0c0 7-3 7-3 8.5h18c0-1.5-3-1.5-3-8.5"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>
      </div>
      <div class="top-copy">
        <span id="r-kicker">课铃提醒</span>
        <strong>该看一看了</strong>
      </div>
      <button class="close-btn no-drag" id="r-close" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="reminder-body drag-zone">
      <div class="reminder-course" id="r-course">课程作业</div>
      <h1 class="reminder-title" id="r-title">任务提醒</h1>
      <div class="reminder-meta">
        <span class="meta-item" id="r-due">—</span>
        <span class="meta-dot"></span>
        <span class="meta-item accent" id="r-count">—</span>
      </div>
      <div class="reminder-actions no-drag" id="r-actions">
        <button class="r-btn r-btn-ghost" id="r-snooze">稍后 10 分钟</button>
        <button class="r-btn r-btn-gold" id="r-open">查看任务</button>
        <button class="r-btn r-btn-primary" id="r-done">标记完成</button>
      </div>
    </div>
    <div class="reminder-footer drag-zone">
      <span class="footer-brand"><img src="assets/icon.png" alt="" />课铃 ClassBell</span>
      <span class="footer-hint" id="r-hint">按 Esc 关闭 · 稍后仍会提醒</span>
    </div>
  </div>
  <script src="bridge.js"></script>
  <script src="reminder.js"></script>
</body>
</html>
